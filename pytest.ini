# Running `pytest` from the repository root used to find no config at all, so
# `asyncio_mode` was never applied and every async test failed — 26 failures
# that said nothing about the code. The real suite lives in backend/, which has
# its own pytest.ini for running from in there; this makes the root behave the
# same way instead of failing confusingly.
[pytest]
testpaths = backend/tests
asyncio_mode = auto
pythonpath = backend
