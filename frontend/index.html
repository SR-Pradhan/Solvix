<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Every icon here is transparent artwork with a white upper half, so on
         a LIGHT browser tab the top of the mark disappears and only the blue
         arrow is left. The dark-plate export (solvix-favicon-dark-bg.png) was
         the one that stayed legible on any background; it has been removed
         from the asset folder, so this is currently the best of what is left.
         Restoring that file and pointing the first PNG link at it is the fix.
         -->
    <link rel="icon" href="/solvix-favicon-assets/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      href="/solvix-favicon-assets/solvix-favicon-512.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      media="(prefers-color-scheme: dark)"
      href="/solvix-favicon-assets/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      media="(prefers-color-scheme: dark)"
      href="/solvix-favicon-assets/favicon-16.png"
    />
    <link
      rel="apple-touch-icon"
      href="/solvix-favicon-assets/solvix-apple-touch-icon.png"
    />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solvix</title>
    <meta name="description" content="Practice that knows what you are weak at. Solvix reads your Codeforces and LeetCode history and your solution code, scores every topic, plans each day, and reminds you what to revise." />
    <meta property="og:title" content="Solvix" />
    <meta property="og:description" content="DSA practice that knows what you are weak at — derived from your own submissions, nothing logged by hand." />
    <meta property="og:type" content="website" />
    <meta
      name="description"
      content="Solvix reads your Codeforces and LeetCode history, finds the topics going stale, and plans your practice."
    />
    <!-- Runs before first paint so a light-theme user never sees a dark
         flash while the bundle loads. -->
    <script>
      (function () {
        var saved = localStorage.getItem("solvix-theme");
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
