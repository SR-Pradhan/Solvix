<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The official icon set. The .ico carries the multi-resolution copy
         Windows and older browsers ask for; the PNGs are what everything else
         picks, and the apple-touch icon is the home-screen tile. -->
    <link rel="icon" href="/solvix-favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/solvix-favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/solvix-favicon/favicon-16.png" />
    <link rel="apple-touch-icon" href="/solvix-favicon/solvix-apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solvix</title>
    <meta
      name="description"
      content="Solvix reads your Codeforces and LeetCode history, finds the topics going stale, and plans your practice."
    />
    <!-- Runs before first paint so a light-theme user never sees a dark
         flash while the bundle loads. -->
    <script>
      (function () {
        var saved = localStorage.getItem("solvix-theme");
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
