<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The icon set, chosen by where it will be drawn.
         The 16/32 PNGs are transparent with a white upper half, so on a light
         tab strip the top of the mark vanishes and only the blue arrow shows.
         The dark-plate version stays legible on any background, so it is the
         default; browsers that report a dark UI get the transparent artwork,
         which looks better there. Anything that understands neither falls back
         to the .ico. -->
    <link rel="icon" href="/solvix-favicon-assets/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      href="/solvix-favicon-assets/solvix-favicon-dark-bg.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      media="(prefers-color-scheme: dark)"
      href="/solvix-favicon-assets/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      media="(prefers-color-scheme: dark)"
      href="/solvix-favicon-assets/favicon-16.png"
    />
    <link
      rel="apple-touch-icon"
      href="/solvix-favicon-assets/solvix-apple-touch-icon.png"
    />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solvix</title>
    <meta
      name="description"
      content="Solvix reads your Codeforces and LeetCode history, finds the topics going stale, and plans your practice."
    />
    <!-- Runs before first paint so a light-theme user never sees a dark
         flash while the bundle loads. -->
    <script>
      (function () {
        var saved = localStorage.getItem("solvix-theme");
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
